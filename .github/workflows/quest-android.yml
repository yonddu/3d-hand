name: Quest hand recorder
concurrency:
  group: quest-android-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths: ['native/quest/**', '.github/workflows/quest-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Quest APK
        working-directory: native/quest
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quest-hand-recorder
          path: native/quest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
